name: Container image

# The runner is labelled native:host, so every step runs in a shell on the host
# under the unprivileged forgejo-runner user, with its rootless podman. No
# Docker daemon. JavaScript actions do work here (Node is in the service PATH),
# so actions/checkout is available if a later workflow wants it.

# Manual only: most commits here do not deserve an image.
on:
  workflow_dispatch:

env:
  IMAGE: git.thehuf.uk/cedric/reclip

jobs:
  build:
    runs-on: native
    steps:
      - name: Check out
        run: |
          set -eu
          find . -mindepth 1 -delete
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ github.token }}@git.thehuf.uk/$GITHUB_REPOSITORY.git" .

      - name: Build
        run: |
          set -eu
          SHA=$(git rev-parse --short HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          TAGS="-t $IMAGE:$SHA -t $IMAGE:latest"
          case "$GITHUB_REF" in
            refs/tags/*) TAGS="$TAGS -t $IMAGE:$GITHUB_REF_NAME" ;;
          esac
          # The source label is what makes Forgejo attach the package to the repo.
          podman build \
            --label "org.opencontainers.image.source=https://git.thehuf.uk/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            $TAGS .

      - name: Push
        run: |
          set -eu
          # The run token may already open the registry, which would save a
          # dedicated secret. Undocumented, so keep the fallback until a green
          # run proves it.
          if printf '%s' '${{ github.token }}' \
              | podman login --username "$GITHUB_ACTOR" --password-stdin git.thehuf.uk
          then
            echo "registry: authenticated with the run token"
          elif [ -n '${{ secrets.REGISTRY_TOKEN }}' ]; then
            echo "registry: run token refused, falling back to REGISTRY_TOKEN"
            printf '%s' '${{ secrets.REGISTRY_TOKEN }}' \
              | podman login --username "$GITHUB_ACTOR" --password-stdin git.thehuf.uk
          else
            echo "registry: run token refused and no REGISTRY_TOKEN secret is set" >&2
            exit 1
          fi
          podman push "$IMAGE:$SHA"
          podman push "$IMAGE:latest"
          case "$GITHUB_REF" in
            refs/tags/*) podman push "$IMAGE:$GITHUB_REF_NAME" ;;
          esac
          podman logout git.thehuf.uk
