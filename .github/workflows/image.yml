# Built when a release is published, never on a push: most commits do not
# deserve an image, and the tag is what says which ones do.
name: Container image

# Called by the release workflow, in the same run: an event raised by the run
# token starts no other workflow, so a release cannot trigger this one on its
# own. Also available by hand, to rebuild an image without cutting a version.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "value=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      # arm64 is built under emulation on an x86 runner, which is slow: the
      # apt and pip steps of the Dockerfile pay for it. The layer cache below is
      # what keeps that to one long build rather than one per release.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version reaches the running app through this build argument, and
      # /admin shows it: that is the answer to "is the fix I pushed the one I am
      # looking at".
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: MAGNETO_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/magneto:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/magneto:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
