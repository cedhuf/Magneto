services:
  magneto:
    build: .
    image: magneto:latest
    container_name: magneto
    ports:
      - "8899:8899"
    volumes:
      - magneto-downloads:/app/downloads
      - magneto-data:/app/data
    environment:
      # Personal instance: one implicit user, nothing to log into.
      # Set to "proxy" behind a forward-auth proxy, and bind to localhost then.
      MAGNETO_AUTH: "none"
      MAGNETO_RETENTION: "86400"
      # The two pages that talk to YouTube on their own. Off unless asked for.
      MAGNETO_FEED: "0"
      MAGNETO_SHORTS: "0"
      MAGNETO_TIKTOK: "0"
    restart: unless-stopped

volumes:
  magneto-downloads:
  magneto-data:
