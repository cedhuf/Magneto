<!DOCTYPE html>
<html lang="en">
<head>
  {% set page_title = "ReClip — Feed" %}
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    {% set tagline = "Your channels, newest first" %}
    {% include "_header.html" %}

    <div class="feed-head" id="feedHead">
      <span id="videoCount"></span>
      <span class="feed-head-actions">
        <button class="link-btn" id="addBtn">Add channels</button>
        <button class="link-btn" id="layoutBtn">Grid</button>
        <button class="link-btn" id="settingsBtn">Settings</button>
        <button class="link-btn" id="refreshBtn">Refresh feed</button>
      </span>
    </div>
    <div class="feed-panel feed-add-panel" id="addPanel" hidden>
      <form class="feed-add" id="addForm">
        <input id="channelUrl" type="url" placeholder="Paste a YouTube channel URL…" required>
        <button class="fetch-btn" id="addSubmit">Add</button>
      </form>
      <label class="feed-import">
        <span>Or import subscriptions.csv from a YouTube export</span>
        <input type="file" id="importFile" accept=".csv,text/csv">
      </label>
    </div>
    <div class="feed-panel feed-settings" id="settings" hidden>
      <label>Quality
        <span class="pill-group" id="qualityPills"></span>
      </label>
      <label>Videos per channel
        <span class="pill-group" id="countPills"></span>
      </label>
    </div>
    <p class="hint" id="message" hidden></p>
    <div class="cards grid" id="videos"></div>
    <div class="subscriptions" id="subscriptions" hidden>
      <div class="history-head">Channels</div>
      <div class="channel-list" id="channelList"></div>
    </div>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/format.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/card.js"></script>
  <script src="/static/delete.js"></script>
  <script src="/static/actions.js"></script>
  <script>
    let feedVideos = [];
    let feedChannels = [];
    let feedSettings = {videos: 3, quality: 720};
    let feedLimits = {videos_max: 5, qualities: [720]};
    /* The bar above already says when there is nothing yet, so this line only
       exists while it has something to report, and takes no room otherwise. */
    function message(text, error = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.hidden = !text;
      el.style.color = error ? 'var(--error)' : '';
    }

    async function load() {
      const res = await fetch('/api/feed');
      if (!res.ok) return;
      const data = await res.json();
      feedVideos = data.videos;
      feedChannels = data.channels;
      feedSettings = data.settings;
      feedLimits = data.limits;
      renderSettings();
      const videos = document.getElementById('videos');
      videos.innerHTML = data.videos.map((v, i) => mediaCardMarkup({
        thumbnail: v.thumbnail,
        alt: v.title,
        badges: [{text: fmtDur(v.duration), place: 'end'},
                 v.ready ? {text: 'Ready', place: 'start ready'} : null],
        play: `playVideo(${i})`,
        title: v.title,
        meta: [esc(v.uploader), fmtDate(v.upload_date)].filter(Boolean).join(' \u00b7 '),
        // The same block as the home page once the file is this account's: a
        // feed video that has been downloaded is a download like any other.
        actions: `<button class="card-dl-btn" id="save-${i}" onclick="saveVideo(${i})">${
          v.ready ? 'Save' : 'Download'}</button>`
          + (v.job_id ? entryIcons({pinned: v.pinned, onPin: `togglePin(${i})`,
                                    onDelete: `removeVideo(${i})`}) : ''),
      })).join('');
      // The head is the only way to add a channel, so it stays even when there
      // is nothing yet. What it offers is what makes sense at that moment.
      const empty = !data.channels.length;
      document.getElementById('videoCount').textContent = empty
        ? 'No channels yet'
        : `${data.videos.length} video${data.videos.length === 1 ? '' : 's'} from ${data.channels.length} channel${data.channels.length === 1 ? '' : 's'}`;
      document.getElementById('layoutBtn').hidden = !data.videos.length;
      document.getElementById('settingsBtn').hidden = empty;
      document.getElementById('refreshBtn').hidden = empty;
      if (empty) document.getElementById('addPanel').hidden = false;
      const list = document.getElementById('channelList');
      list.innerHTML = data.channels.map(c => `<div class="channel-row">
        <span>${esc(c.title)}</span>
        <span class="channel-actions">
          <button class="row-btn" onclick="refreshChannel('${esc(c.channel_id)}', this)">Refresh</button>
          ${deleteButton(`removeChannel('${esc(c.channel_id)}')`, {label: 'Remove'})}
        </span>
      </div>`).join('');
      document.getElementById('subscriptions').hidden = !data.channels.length;
    }

    /* One setting for the whole feed: it is a reading surface, so a quality is
       chosen once rather than per video like on the downloader. */
    function renderSettings() {
      document.getElementById('qualityPills').innerHTML = feedLimits.qualities.map(q =>
        `<button class="pill${q === feedSettings.quality ? ' active' : ''}"
          onclick="setSetting('quality', ${q})">${q}p</button>`).join('');
      const counts = Array.from({length: feedLimits.videos_max}, (_, i) => i + 1);
      document.getElementById('countPills').innerHTML = counts.map(n =>
        `<button class="pill${n === feedSettings.videos ? ' active' : ''}"
          onclick="setSetting('videos', ${n})">${n}</button>`).join('');
    }

    async function setSetting(key, value) {
      const previous = feedSettings[key];
      feedSettings = {...feedSettings, [key]: value};
      renderSettings();
      const res = await fetch('/api/feed/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(feedSettings),
      });
      if (!res.ok) {
        feedSettings = {...feedSettings, [key]: previous};
        renderSettings();
        return message('Could not save settings.', true);
      }
      feedSettings = await res.json();
      renderSettings();
      // The cache holds the instance maximum, so a new count is a slice of what
      // is already there: no lookup, no refresh.
      if (key === 'videos') await load();
      message('Saved.');
    }

    /* Two folded panels, one behaviour: opening one closes the other, so the
       page never grows two headers of controls at once. */
    function togglePanel(id) {
      const panel = document.getElementById(id);
      const other = document.getElementById(id === 'settings' ? 'addPanel' : 'settings');
      other.hidden = true;
      panel.hidden = !panel.hidden;
    }
    document.getElementById('settingsBtn').addEventListener('click', () => togglePanel('settings'));
    document.getElementById('addBtn').addEventListener('click', () => togglePanel('addPanel'));

    document.getElementById('addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('addSubmit');
      button.disabled = true; button.textContent = 'Adding…'; message('Looking up channel…');
      try {
        const res = await fetch('/api/feed/subscriptions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: document.getElementById('channelUrl').value})});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not add channel');
        document.getElementById('channelUrl').value = ''; message('Channel added.'); await load();
      } catch (err) { message(friendlyError(err.message), true); }
      button.disabled = false; button.textContent = 'Add';
    });

    /* An import follows nobody's channels at once and looks none of them up:
       the poller fills them one at a time, which is the whole point. */
    document.getElementById('importFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      message('Reading the file…');
      try {
        const res = await fetch('/api/feed/import', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({csv: await file.text()}),
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Could not read this file');
        await load();
        const parts = [`${d.added} channel${d.added === 1 ? '' : 's'} added`];
        if (d.already) parts.push(`${d.already} already followed`);
        if (d.skipped) parts.push(`${d.skipped} unreadable`);
        if (d.full) parts.push(`stopped at the ${d.limit} channel limit`);
        message(`${parts.join(', ')}. Videos arrive one channel every ${Math.round(d.every / 60)} min.`);
      } catch (err) { message(friendlyError(err.message), true); }
      e.target.value = '';
    });
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const button = document.getElementById('refreshBtn');
      button.disabled = true;
      // One channel per request, so the wait is visible and no single call can
      // outlive the worker timeout.
      let done = 0, skipped = 0, failed = 0;
      for (let i = 0; i < feedChannels.length; i++) {
        button.textContent = `Refreshing ${i + 1}/${feedChannels.length}…`;
        try {
          const res = await fetch('/api/feed/refresh', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel_id: feedChannels[i].channel_id}),
          });
          const data = await res.json();
          if (!res.ok) failed++;
          else if (data.skipped) skipped++;
          else done++;
        } catch (e) { failed++; }
      }
      await load();
      // Skipped is the normal case, not a failure: the server refuses to ask
      // YouTube again about a channel it looked up a moment ago.
      const parts = [];
      if (done) parts.push(`${done} refreshed`);
      if (skipped) parts.push(`${skipped} already fresh`);
      if (failed) parts.push(`${failed} failed`);
      message(parts.join(', ') || 'Nothing to refresh.', !!failed);
      button.disabled = false;
      button.textContent = 'Refresh feed';
    });
    /* Playing means downloading first, then using the app's own player on the
       app's own file. Never a YouTube embed: downloading first is what keeps
       the viewer on the instance. */
    async function startDownload(video) {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          url: video.url,
          format: 'video',
          max_height: feedSettings.quality,
          title: video.title,
          thumbnail: video.thumbnail,
          uploader: video.uploader,
          upload_date: video.upload_date,
          description: video.description || '',
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.job_id;
    }

    function waitForFile(jobId) {
      return new Promise((resolve, reject) => {
        const poll = setInterval(async () => {
          try {
            const res = await fetch(`/api/status/${jobId}`);
            const data = await res.json();
            if (data.status === 'done') { clearInterval(poll); resolve(data); }
            else if (data.status === 'error') { clearInterval(poll); reject(new Error(data.error)); }
          } catch (e) { clearInterval(poll); reject(e); }
        }, 1000);
      });
    }

    /* Progress belongs on the card, as on the home page: the modal opens once
       there is something to play. */
    async function prepare(index, label) {
      const button = document.getElementById(`save-${index}`);
      const previous = button ? button.textContent : '';
      if (button) { button.textContent = label; button.disabled = true; }
      try {
        const jobId = await startDownload(feedVideos[index]);
        const done = await waitForFile(jobId);
        feedVideos[index].ready = true;
        return {jobId, filename: done.filename};
      } finally {
        if (button) { button.textContent = previous; button.disabled = false; }
      }
    }

    async function playVideo(index) {
      try {
        const file = await prepare(index, 'Preparing\u2026');
        openPlayer({...feedVideos[index], ...file});
      } catch (err) { message(friendlyError(err.message), true); }
    }

    async function saveVideo(index) {
      try {
        const file = await prepare(index, 'Downloading\u2026');
        const a = document.createElement('a');
        a.href = `/api/file/${file.jobId}`;
        a.download = file.filename || '';
        a.click();
        message('Saved.');
      } catch (err) { message(friendlyError(err.message), true); }
    }

    /* A feed video that has a file is an entry of this account, so it takes the
       same two actions as on the home page. */
    async function togglePin(index) {
      const video = feedVideos[index];
      const res = await fetch(`/api/entries/${video.job_id}/pin`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pinned: !video.pinned}),
      });
      if (res.ok) await load();
    }

    async function removeVideo(index) {
      await fetch(`/api/entries/${feedVideos[index].job_id}`, {method: 'DELETE'});
      await load();
    }

    async function removeChannel(id) {
      await fetch(`/api/feed/subscriptions/${encodeURIComponent(id)}`, {method: 'DELETE'}); load();
    }

    /* Refreshing one channel on purpose skips the spacing that Refresh feed
       obeys: the user knows a video is out, and asking about every channel to
       reach that one is what made the button useless. */
    async function refreshChannel(id, button) {
      button.disabled = true; button.textContent = 'Refreshing…';
      try {
        const res = await fetch('/api/feed/refresh', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({channel_id: id, force: true}),
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Could not refresh');
        await load();
        message('Channel refreshed.');
      } catch (err) {
        message(friendlyError(err.message), true);
        button.disabled = false; button.textContent = 'Refresh';
      }
    }
    initLayoutToggle(['videos'], 'layout.feed', 'grid');
    load();
  </script>
  <script src="/static/theme.js"></script>
</body>
</html>
