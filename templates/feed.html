<!DOCTYPE html>
<html lang="en">
<head>
  {% set page_title = "ReClip — Feed" %}
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    {% set tagline = "Your channels, newest first" %}
    {% include "_header.html" %}

    <form class="feed-add" id="addForm">
      <input id="channelUrl" type="url" placeholder="Paste a YouTube channel URL…" required>
      <button class="fetch-btn" id="addBtn">Add channel</button>
    </form>
    <p class="hint" id="message">Add a channel to see its latest videos.</p>

    <div class="feed-head" id="feedHead" hidden>
      <span id="videoCount"></span>
      <span class="feed-head-actions">
        <button class="link-btn" id="settingsBtn">Settings</button>
        <button class="link-btn" id="refreshBtn">Refresh feed</button>
      </span>
    </div>
    <div class="feed-settings" id="settings" hidden>
      <label>Quality
        <span class="pill-group" id="qualityPills"></span>
      </label>
      <label>Videos per channel
        <span class="pill-group" id="countPills"></span>
      </label>
    </div>
    <div class="feed-grid" id="videos"></div>
    <div class="subscriptions" id="subscriptions" hidden>
      <div class="history-head">Channels</div>
      <div class="channel-list" id="channelList"></div>
    </div>
  </div>

  <script src="/static/format.js"></script>
  <script src="/static/modal.js"></script>
  <script>
    let feedVideos = [];
    let feedChannels = [];
    let feedSettings = {videos: 3, quality: 720};
    let feedLimits = {videos_max: 5, qualities: [720]};
    function message(text, error = false) { const el = document.getElementById('message'); el.textContent = text; el.style.color = error ? 'var(--error)' : ''; }

    async function load() {
      const res = await fetch('/api/feed');
      if (!res.ok) return;
      const data = await res.json();
      feedVideos = data.videos;
      feedChannels = data.channels;
      feedSettings = data.settings;
      feedLimits = data.limits;
      renderSettings();
      const videos = document.getElementById('videos');
      videos.innerHTML = data.videos.map((v, i) => `<button class="feed-video" type="button" onclick="openVideo(${i})">
        <div class="feed-thumb">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="">` : ''}${fmtDate(v.upload_date) ? `<span class="feed-date">${fmtDate(v.upload_date)}</span>` : ''}${v.duration ? `<span class="feed-duration">${fmtDur(v.duration)}</span>` : ''}</div>
        <div class="feed-video-body"><div class="feed-video-title">${esc(v.title)}</div>
        <div class="feed-video-meta">${esc(v.channel)}${fmtDate(v.upload_date) ? ` · ${fmtDate(v.upload_date)}` : ''}</div></div>
      </button>`).join('');
      document.getElementById('feedHead').hidden = !data.channels.length;
      document.getElementById('videoCount').textContent = `${data.videos.length} latest video${data.videos.length === 1 ? '' : 's'}`;
      const list = document.getElementById('channelList');
      list.innerHTML = data.channels.map(c => `<div class="channel-row"><span>${esc(c.title)}</span><button class="row-btn" onclick="removeChannel('${esc(c.channel_id)}')">Remove</button></div>`).join('');
      document.getElementById('subscriptions').hidden = !data.channels.length;
    }

    /* One setting for the whole feed: it is a reading surface, so a quality is
       chosen once rather than per video like on the downloader. */
    function renderSettings() {
      document.getElementById('qualityPills').innerHTML = feedLimits.qualities.map(q =>
        `<button class="pill${q === feedSettings.quality ? ' active' : ''}"
          onclick="setSetting('quality', ${q})">${q}p</button>`).join('');
      const counts = Array.from({length: feedLimits.videos_max}, (_, i) => i + 1);
      document.getElementById('countPills').innerHTML = counts.map(n =>
        `<button class="pill${n === feedSettings.videos ? ' active' : ''}"
          onclick="setSetting('videos', ${n})">${n}</button>`).join('');
    }

    async function setSetting(key, value) {
      const previous = feedSettings[key];
      feedSettings = {...feedSettings, [key]: value};
      renderSettings();
      const res = await fetch('/api/feed/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(feedSettings),
      });
      if (!res.ok) {
        feedSettings = {...feedSettings, [key]: previous};
        renderSettings();
        return message('Could not save settings.', true);
      }
      feedSettings = await res.json();
      renderSettings();
      // The count changes what a channel holds, so it only shows after a refresh.
      message(key === 'videos'
        ? 'Saved. Refresh the feed to apply the new count.'
        : 'Saved.');
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settings');
      panel.hidden = !panel.hidden;
    });

    document.getElementById('addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('addBtn');
      button.disabled = true; button.textContent = 'Adding…'; message('Looking up channel…');
      try {
        const res = await fetch('/api/feed/subscriptions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: document.getElementById('channelUrl').value})});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not add channel');
        document.getElementById('channelUrl').value = ''; message('Channel added.'); await load();
      } catch (err) { message(friendlyError(err.message), true); }
      button.disabled = false; button.textContent = 'Add channel';
    });
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const button = document.getElementById('refreshBtn');
      button.disabled = true;
      // One channel per request, so the wait is visible and no single call can
      // outlive the worker timeout.
      let failed = 0;
      for (let i = 0; i < feedChannels.length; i++) {
        button.textContent = `Refreshing ${i + 1}/${feedChannels.length}…`;
        try {
          const res = await fetch('/api/feed/refresh', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel_id: feedChannels[i].channel_id}),
          });
          if (!res.ok) failed++;
        } catch (e) { failed++; }
      }
      await load();
      message(failed ? `${failed} channel(s) could not be refreshed.` : 'Feed refreshed.', !!failed);
      button.disabled = false;
      button.textContent = 'Refresh feed';
    });
    /* Playing means downloading first, then using the app's own player on the
       app's own file. The previous version embedded a YouTube iframe, which
       sent every viewer straight back to YouTube. */
    function videoSheet(video, media, actions) {
      openModal({
        title: video.title,
        meta: [video.channel, fmtDate(video.upload_date), fmtDur(video.duration)]
          .filter(Boolean).join(' \u00b7 '),
        description: video.description || '',
        media,
        actions,
      });
    }

    function openVideo(index) {
      const video = feedVideos[index];
      videoSheet(video, posterMarkup(video.thumbnail, 'Not downloaded yet'),
        `<button class="card-dl-btn" onclick="playVideo(${index})">Play</button>
         <button class="card-dl-btn" onclick="saveVideo(${index})">Download</button>`);
    }

    async function startDownload(video) {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          url: video.url,
          format: 'video',
          max_height: feedSettings.quality,
          title: video.title,
          thumbnail: video.thumbnail,
          uploader: video.channel,
          upload_date: video.upload_date,
          description: video.description || '',
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.job_id;
    }

    function waitForFile(jobId) {
      return new Promise((resolve, reject) => {
        const poll = setInterval(async () => {
          try {
            const res = await fetch(`/api/status/${jobId}`);
            const data = await res.json();
            if (data.status === 'done') { clearInterval(poll); resolve(data); }
            else if (data.status === 'error') { clearInterval(poll); reject(new Error(data.error)); }
          } catch (e) { clearInterval(poll); reject(e); }
        }, 1000);
      });
    }

    async function playVideo(index) {
      const video = feedVideos[index];
      videoSheet(video, posterMarkup(video.thumbnail, 'Preparing\u2026'), '');
      try {
        const jobId = await startDownload(video);
        const done = await waitForFile(jobId);
        videoSheet(video, mediaMarkup(jobId, done.filename),
          `<a class="card-dl-btn" href="/api/file/${jobId}" download>Save</a>`);
      } catch (err) {
        videoSheet(video, posterMarkup(video.thumbnail, friendlyError(err.message)),
          `<button class="card-dl-btn" onclick="playVideo(${index})">Try again</button>`);
      }
    }

    async function saveVideo(index) {
      const video = feedVideos[index];
      videoSheet(video, posterMarkup(video.thumbnail, 'Downloading\u2026'), '');
      try {
        const jobId = await startDownload(video);
        const done = await waitForFile(jobId);
        const a = document.createElement('a');
        a.href = `/api/file/${jobId}`;
        a.download = done.filename || '';
        a.click();
        videoSheet(video, posterMarkup(video.thumbnail, 'Saved'),
          `<button class="card-dl-btn" onclick="playVideo(${index})">Play</button>`);
      } catch (err) {
        videoSheet(video, posterMarkup(video.thumbnail, friendlyError(err.message)),
          `<button class="card-dl-btn" onclick="saveVideo(${index})">Try again</button>`);
      }
    }

    async function removeChannel(id) {
      if (!confirm('Remove this channel from your feed?')) return;
      await fetch(`/api/feed/subscriptions/${encodeURIComponent(id)}`, {method: 'DELETE'}); load();
    }
    load();
  </script>
  <script src="/static/theme.js"></script>
</body>
</html>
