<!DOCTYPE html>
<html lang="en">
<head>
  {% set page_title = "Magneto Feed" %}
  {% set styles = ['cards', 'follow'] %}
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    {% set tagline = "Your channels, newest first" %}
    {% include "_header.html" %}

    <div class="feed-head" id="feedHead">
      <span id="videoCount"></span>
      <span class="feed-head-actions">
        <button class="link-btn" id="layoutBtn">Grid</button>
        <button class="link-btn" id="settingsBtn">Settings</button>
      </span>
    </div>
    <div class="feed-panel feed-settings" id="settings" hidden>
      <label>Quality
        <span class="pill-group" id="qualityPills"></span>
      </label>
      <label>Videos per channel
        <span class="pill-group" id="countPills"></span>
      </label>
    </div>
    <p class="hint" id="message" hidden></p>
    <div class="cards grid" id="videos"></div>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/format.js"></script>
  <script src="/static/modal.js"></script>
  <script src="/static/card.js"></script>
  <script src="/static/delete.js"></script>
  <script src="/static/actions.js"></script>
  <script src="/static/jobs.js"></script>
  <script>
    let feedVideos = [];
    let feedChannels = [];
    let feedSettings = {videos: 3, quality: 720};
    let feedLimits = {videos_max: 5, qualities: [720]};
    /* The bar above already says when there is nothing yet, so this line only
       exists while it has something to report, and takes no room otherwise. */
    function message(text, error = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.hidden = !text;
      el.style.color = error ? 'var(--error)' : '';
    }

    async function load() {
      const res = await fetch('/api/feed');
      if (!res.ok) return;
      const data = await res.json();
      feedVideos = data.videos;
      feedChannels = data.channels;
      feedSettings = data.settings;
      feedLimits = data.limits;
      renderSettings();
      const videos = document.getElementById('videos');
      videos.innerHTML = data.videos.map((v, i) => mediaCardMarkup({
        thumbnail: v.thumbnail,
        alt: v.title,
        badges: [{text: fmtDur(v.duration), place: 'end'},
                 v.ready ? {text: 'Ready', place: 'start ready'} : null],
        play: `playVideo(${i})`,
        title: v.title,
        meta: [esc(v.uploader), fmtDate(v.upload_date)].filter(Boolean).join(' \u00b7 '),
        // The same block as the home page once the file is this account's: a
        // feed video that has been downloaded is a download like any other.
        actions: `<button class="card-dl-btn" id="save-${i}" onclick="saveVideo(${i})">${
          v.ready ? 'Save' : 'Download'}</button>`
          + (v.job_id ? entryIcons({pinned: v.pinned, onPin: `togglePin(${i})`,
                                    onDelete: `removeVideo(${i})`}) : ''),
      })).join('');
      // Channels are followed on their own page, so this one only reports.
      const empty = !data.channels.length;
      document.getElementById('videoCount').textContent = empty
        ? 'No channels yet, follow some on Following'
        : `${data.videos.length} video${data.videos.length === 1 ? '' : 's'} from ${data.channels.length} channel${data.channels.length === 1 ? '' : 's'}`;
      document.getElementById('layoutBtn').hidden = !data.videos.length;
      document.getElementById('settingsBtn').hidden = empty;
    }

    /* One setting for the whole feed: it is a reading surface, so a quality is
       chosen once rather than per video like on the downloader. */
    function renderSettings() {
      document.getElementById('qualityPills').innerHTML = feedLimits.qualities.map(q =>
        `<button class="pill${q === feedSettings.quality ? ' active' : ''}"
          onclick="setSetting('quality', ${q})">${q}p</button>`).join('');
      const counts = Array.from({length: feedLimits.videos_max}, (_, i) => i + 1);
      document.getElementById('countPills').innerHTML = counts.map(n =>
        `<button class="pill${n === feedSettings.videos ? ' active' : ''}"
          onclick="setSetting('videos', ${n})">${n}</button>`).join('');
    }

    async function setSetting(key, value) {
      const previous = feedSettings[key];
      feedSettings = {...feedSettings, [key]: value};
      renderSettings();
      const res = await fetch('/api/feed/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(feedSettings),
      });
      if (!res.ok) {
        feedSettings = {...feedSettings, [key]: previous};
        renderSettings();
        return message('Could not save settings.', true);
      }
      feedSettings = await res.json();
      renderSettings();
      // The cache holds the instance maximum, so a new count is a slice of what
      // is already there: no lookup, no refresh.
      if (key === 'videos') await load();
      message('Saved.');
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settings');
      panel.hidden = !panel.hidden;
    });

    /* Playing means downloading first, then using the app's own player on the
       app's own file. Never a YouTube embed: downloading first is what keeps
       the viewer on the instance. */
    async function startDownload(video) {
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          url: video.url,
          format: 'video',
          max_height: feedSettings.quality,
          title: video.title,
          thumbnail: video.thumbnail,
          uploader: video.uploader,
          upload_date: video.upload_date,
          description: video.description || '',
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data.job_id;
    }

    /* Progress belongs on the card, as on the home page: the modal opens once
       there is something to play. */
    async function prepare(index, label) {
      const button = document.getElementById(`save-${index}`);
      const previous = button ? button.textContent : '';
      if (button) { button.textContent = label; button.disabled = true; }
      try {
        const jobId = await startDownload(feedVideos[index]);
        const done = await waitForFile(jobId);
        feedVideos[index].ready = true;
        return {jobId, filename: done.filename};
      } finally {
        if (button) { button.textContent = previous; button.disabled = false; }
      }
    }

    async function playVideo(index) {
      try {
        const file = await prepare(index, 'Preparing\u2026');
        openPlayer({...feedVideos[index], ...file});
      } catch (err) { message(friendlyError(err.message), true); }
    }

    async function saveVideo(index) {
      try {
        const file = await prepare(index, 'Downloading\u2026');
        const a = document.createElement('a');
        a.href = `/api/file/${file.jobId}`;
        a.download = file.filename || '';
        a.click();
        message('Saved.');
      } catch (err) { message(friendlyError(err.message), true); }
    }

    /* A feed video that has a file is an entry of this account, so it takes the
       same two actions as on the home page. */
    async function togglePin(index) {
      const video = feedVideos[index];
      const res = await fetch(`/api/entries/${video.job_id}/pin`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pinned: !video.pinned}),
      });
      if (res.ok) await load();
    }

    async function removeVideo(index) {
      await fetch(`/api/entries/${feedVideos[index].job_id}`, {method: 'DELETE'});
      await load();
    }

    initLayoutToggle(['videos'], 'layout.feed', 'grid');
    load();
  </script>
  <script src="/static/theme.js"></script>
</body>
</html>
