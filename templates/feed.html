<!DOCTYPE html>
<html lang="en">
<head>
  {% set page_title = "ReClip — Feed" %}
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    {% set tagline = "Your channels, newest first" %}
    {% include "_header.html" %}

    <form class="feed-add" id="addForm">
      <input id="channelUrl" type="url" placeholder="Paste a YouTube channel URL…" required>
      <button class="fetch-btn" id="addBtn">Add channel</button>
    </form>
    <p class="hint" id="message">Add a channel to see its latest videos.</p>

    <div class="feed-head" id="feedHead" hidden>
      <span id="videoCount"></span>
      <button class="link-btn" id="refreshBtn">Refresh feed</button>
    </div>
    <div class="feed-grid" id="videos"></div>
    <div class="subscriptions" id="subscriptions" hidden>
      <div class="history-head">Channels</div>
      <div class="channel-list" id="channelList"></div>
    </div>
  </div>
  <div class="feed-modal" id="modal" hidden>
    <div class="feed-modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="player-close feed-modal-close" onclick="closeVideo()" aria-label="Close">×</button>
      <div id="modalMedia"></div>
      <div class="feed-modal-body"><h2 id="modalTitle"></h2><div id="modalMeta" class="feed-video-meta"></div><p id="modalDescription"></p>
        <a class="card-dl-btn" id="downloadLink">Download</a></div>
    </div>
  </div>

  <script src="/static/format.js"></script>
  <script>
    let feedVideos = [];
    let feedChannels = [];
    function message(text, error = false) { const el = document.getElementById('message'); el.textContent = text; el.style.color = error ? 'var(--error)' : ''; }

    async function load() {
      const res = await fetch('/api/feed');
      if (!res.ok) return;
      const data = await res.json();
      feedVideos = data.videos;
      feedChannels = data.channels;
      const videos = document.getElementById('videos');
      videos.innerHTML = data.videos.map((v, i) => `<button class="feed-video" type="button" onclick="openVideo(${i})">
        <div class="feed-thumb">${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="">` : ''}${fmtDate(v.upload_date) ? `<span class="feed-date">${fmtDate(v.upload_date)}</span>` : ''}${v.duration ? `<span class="feed-duration">${fmtDur(v.duration)}</span>` : ''}</div>
        <div class="feed-video-body"><div class="feed-video-title">${esc(v.title)}</div>
        <div class="feed-video-meta">${esc(v.channel)}${fmtDate(v.upload_date) ? ` · ${fmtDate(v.upload_date)}` : ''}</div></div>
      </button>`).join('');
      document.getElementById('feedHead').hidden = !data.channels.length;
      document.getElementById('videoCount').textContent = `${data.videos.length} latest video${data.videos.length === 1 ? '' : 's'}`;
      const list = document.getElementById('channelList');
      list.innerHTML = data.channels.map(c => `<div class="channel-row"><span>${esc(c.title)}</span><button class="row-btn" onclick="removeChannel('${esc(c.channel_id)}')">Remove</button></div>`).join('');
      document.getElementById('subscriptions').hidden = !data.channels.length;
    }

    document.getElementById('addForm').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('addBtn');
      button.disabled = true; button.textContent = 'Adding…'; message('Looking up channel…');
      try {
        const res = await fetch('/api/feed/subscriptions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: document.getElementById('channelUrl').value})});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not add channel');
        document.getElementById('channelUrl').value = ''; message('Channel added.'); await load();
      } catch (err) { message(friendlyError(err.message), true); }
      button.disabled = false; button.textContent = 'Add channel';
    });
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const button = document.getElementById('refreshBtn');
      button.disabled = true;
      // One channel per request, so the wait is visible and no single call can
      // outlive the worker timeout.
      let failed = 0;
      for (let i = 0; i < feedChannels.length; i++) {
        button.textContent = `Refreshing ${i + 1}/${feedChannels.length}…`;
        try {
          const res = await fetch('/api/feed/refresh', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel_id: feedChannels[i].channel_id}),
          });
          if (!res.ok) failed++;
        } catch (e) { failed++; }
      }
      await load();
      message(failed ? `${failed} channel(s) could not be refreshed.` : 'Feed refreshed.', !!failed);
      button.disabled = false;
      button.textContent = 'Refresh feed';
    });
    function openVideo(index) {
      const video = feedVideos[index];
      const modal = document.getElementById('modal');
      document.getElementById('modalTitle').textContent = video.title;
      document.getElementById('modalMeta').textContent = [video.channel, fmtDate(video.upload_date)].filter(Boolean).join(' · ');
      document.getElementById('modalDescription').textContent = video.description || 'No description.';
      document.getElementById('downloadLink').href = `/?url=${encodeURIComponent(video.url)}`;
      const media = document.getElementById('modalMedia');
      media.innerHTML = `<button class="feed-modal-thumb" type="button" onclick="playVideo(${index})">${video.thumbnail ? `<img src="${esc(video.thumbnail)}" alt="">` : ''}<span class="feed-play">▶</span></button>`;
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function youtubeId(video) {
      if (video.id) return video.id;
      try {
        const url = new URL(video.url);
        return url.searchParams.get('v') || (url.hostname === 'youtu.be' ? url.pathname.slice(1) : '');
      } catch (e) { return ''; }
    }
    function playVideo(index) {
      const video = feedVideos[index];
      const id = youtubeId(video);
      if (!id) return;
      document.getElementById('modalMedia').innerHTML = `<iframe class="feed-player" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1" title="${esc(video.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    }
    function closeVideo() {
      document.getElementById('modal').hidden = true;
      document.getElementById('modalMedia').textContent = '';
      document.body.style.overflow = '';
    }
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeVideo(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });

    async function removeChannel(id) {
      if (!confirm('Remove this channel from your feed?')) return;
      await fetch(`/api/feed/subscriptions/${encodeURIComponent(id)}`, {method: 'DELETE'}); load();
    }
    load();
  </script>
  <script src="/static/theme.js"></script>
</body>
</html>
