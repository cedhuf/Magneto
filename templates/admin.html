<!DOCTYPE html>
<html lang="en">
<head>
  {% set page_title = "ReClip — Admin" %}
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    {% set tagline = "Administration" %}
    {% include "_header.html" %}

    <div class="stats" id="stats"></div>

    <div class="controls admin-controls">
      <button class="fetch-btn danger del-btn" id="purgeBtn" data-confirm="Confirm: delete everything"
        onclick="if (armDelete(this)) { purgeAll() }">Delete everything</button>
      <span class="card-status" id="purgeMsg"></span>
    </div>

    <div class="history">
      <div class="history-head">Everything on this instance</div>
      <div class="table-scroll">
        <table class="admin-table" id="table"></table>
      </div>
    </div>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/format.js"></script>
  <script src="/static/delete.js"></script>
  <script>
    function fmtSpan(s) {
      if (s <= 0) return 'gone';
      const h = Math.floor(s / 3600);
      if (h >= 48) return `${Math.floor(h / 24)}d`;
      return h ? `${h}h` : `${Math.floor(s / 60)}m`;
    }

    function ago(ts) {
      return fmtSpan(Math.floor(Date.now() / 1000 - ts)).replace('gone', 'now');
    }

    function tile(label, value, hint) {
      return `<div class="stat">
        <div class="stat-value">${esc(value)}</div>
        <div class="stat-label">${esc(label)}</div>
        ${hint ? `<div class="stat-hint">${esc(hint)}</div>` : ''}
      </div>`;
    }

    async function load() {
      const res = await fetch('/api/admin/overview');
      if (!res.ok) {
        document.getElementById('stats').innerHTML =
          '<div class="stat"><div class="stat-value">403</div><div class="stat-label">Not an admin</div></div>';
        return;
      }
      const d = await res.json();

      const users = Object.entries(d.users);
      document.getElementById('stats').innerHTML = [
        tile('Taken by downloads', fmtSize(d.disk.bytes), `${d.disk.files} file(s) on disk`),
        tile('Free on this disk', fmtSize(d.disk.free)),
        tile('Entries', String(d.entries.length), `${users.length} user(s)`),
        tile('Retention', fmtSpan(d.retention), d.auth === 'proxy' ? 'proxy auth' : 'single user'),
      ].join('');

      // One line for every short of every user: they are disposable, and one
      // row each would bury the entries somebody actually asked for.
      const shortsRow = d.shorts.enabled || d.shorts.entries
        ? `<tr class="admin-shorts">
            <td class="col-owner">everyone</td>
            <td class="col-title">Shorts watched</td>
            <td>${d.shorts.entries} kept ${fmtSpan(d.shorts.retention)}</td>
            <td class="num">${d.shorts.bytes ? esc(fmtSize(d.shorts.bytes)) : '—'}</td>
            <td class="num">—</td><td class="num">—</td>
            <td>${d.shorts.entries
              ? `<button class="row-btn del-btn" data-confirm="Confirm"
                  onclick="if (armDelete(this)) { clearShorts() }">Purge</button>`
              : ''}</td>
          </tr>`
        : '';

      const rows = d.entries.map(e => `
        <tr>
          <td class="col-owner">${esc(e.owner)}</td>
          <td class="col-title" title="${esc(e.title || e.url)}">${esc(e.title || e.url)}</td>
          <td>${esc(e.status)}</td>
          <td class="num">${e.bytes ? esc(fmtSize(e.bytes)) : '—'}</td>
          <td class="num">${esc(ago(e.created_at))}</td>
          <td class="num">${e.has_file ? esc(fmtSpan(e.expires_in)) : '—'}</td>
          <td>${deleteButton(`removeEntry('${e.job_id}')`)}</td>
        </tr>`).join('');

      document.getElementById('table').innerHTML = `
        <thead><tr>
          <th>User</th><th>Title</th><th>Status</th>
          <th class="num">Size</th><th class="num">Age</th><th class="num">Left</th><th></th>
        </tr></thead>
        <tbody>${shortsRow}${rows || (shortsRow ? '' : '<tr><td colspan="7">Nothing yet.</td></tr>')}</tbody>`;
    }

    async function purgeAll() {
      // Everyone's entries and everyone's files, not only this account's.
      const btn = document.getElementById('purgeBtn');
      const msg = document.getElementById('purgeMsg');
      btn.disabled = true;
      const res = await fetch('/api/admin/purge', { method: 'POST' });
      const d = await res.json();
      await load();
      btn.disabled = false;
      msg.textContent = res.ok
        ? `${d.entries} entries and ${d.files} files gone, ${fmtSize(d.bytes) || '0 MB'} freed`
          + (d.running ? `, ${d.running} still downloading` : '')
        : 'Could not delete.';
    }

    async function clearShorts() {
      await fetch('/api/admin/shorts', {method: 'DELETE'});
      load();
    }

    async function removeEntry(jobId) {
      // Deletes the file and the entry, so the owner loses it from their
      // history too. Maintenance, not tidying.
      await fetch(`/api/admin/entries/${jobId}`, { method: 'DELETE' });
      load();
    }

    load();
  </script>
  <script src="/static/theme.js"></script>
</body>
</html>
