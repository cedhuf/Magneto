<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Free Media Downloader</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Before first paint, or the page flashes light before the choice applies.
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <div class="brand">
      <div class="brand-text">
        <h1>Re<em>Clip</em></h1>
        <p>Free media downloader</p>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="cycleTheme()" type="button"></button>
    </div>

    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">MP4</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">MP3</button>
      </div>
      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>
    </div>

    <div id="cards" class="cards"></div>

    <div id="history-section" class="history" hidden>
      <div class="history-head">On the server</div>
      <div id="history" class="cards"></div>
    </div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 1000+ more
    </div>
  </div>

  <script>
    let currentFormat = 'video';
    let cardData = [];

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      // Clear the workspace only. Indexes stay valid because the entries are
      // marked rather than removed; the history cards keep working.
      container.innerHTML = '';
      cardData.forEach((c, i) => {
        if (c.zone !== 'history') c.discarded = true;
      });

      // Check if youtube playlist URL
      for (let i = 0; i < urls.length; i++) {
        if (urls[i].includes('list=')) {
          const res = await fetch('/api/playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urls[i] }),
          });
          const data = await res.json();
          if (data.urls) {
            // replace playlist URL with individual video URLs
            urls.splice(i, 1, ...data.urls);
          }
        }
      }

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready' && !c.discarded).length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    /* Two zones: the workspace a Fetch fills, and what the server holds. A card
       moves down to the history the moment its download lands. History is
       always prepended, so restoring an oldest-first list and adding fresh
       arrivals both end up newest first. */
    function renderCard(idx) {
      const c = cardData[idx];
      const parent = document.getElementById(c.zone === 'history' ? 'history' : 'cards');
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        c.zone === 'history' ? parent.prepend(el) : parent.appendChild(el);
      } else if (el.parentElement !== parent) {
        parent.prepend(el);
      }
      document.getElementById('history-section').hidden =
        !document.getElementById('history').children.length;

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${f.label}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download</button>${qualityChips}`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading"><span class="spin"></span> Downloading...</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>
          <span class="card-ttl" id="ttl-${idx}">${ttlLabel(c)}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      } else if (c.status === 'gone') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download again</button>
          <span class="card-ttl">no longer on server</span>`;
      }

      const playHtml = (c.status === 'ready' || c.status === 'done')
        ? `<button class="thumb-play" onclick="playCard(${idx})" aria-label="Play" title="Play">
             <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 21 12 6 21 6 3"/></svg>
           </button>`
        : '';

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}${playHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll()">Download All</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    async function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: c.selectedFormatId,
            title: c.title || '',
            thumbnail: c.thumbnail || '',
            // Set when restarting a history entry, so its row is reused
            // instead of the list growing a duplicate.
            job_id: c.jobId || null,
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            c.status = 'done';
            c.filename = data.filename;
            c.deleteAt = data.expires_in ? Date.now() + data.expires_in * 1000 : null;
            // It is on the server now, so that is where the card belongs.
            c.zone = 'history';
            renderCard(idx);
            // Asking to play should not also drop the file in the user's
            // Downloads folder; the Save button stays available for that.
            if (c.playWhenDone) {
              c.playWhenDone = false;
              openPlayer(idx);
            } else {
              saveCard(idx);
            }
          } else if (data.status === 'error') {
            clearInterval(iv);
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          }
        } catch {
          clearInterval(iv);
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Downloading...'; }

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready' && !cardData[i].discarded) {
          await dlCard(i);
        }
      }

      if (btn) { btn.disabled = false; btn.textContent = 'Download All'; }
    }

    /* The server deletes a file some hours after it lands, so the card says
       how long it will still be there. */
    function ttlLabel(c) {
      if (!c.deleteAt) return '';
      const left = c.deleteAt - Date.now();
      if (left <= 0) return 'deleted from server';
      const h = Math.floor(left / 3600000);
      const m = Math.floor(left / 60000) % 60;
      if (h >= 48) return `on server ${Math.floor(h / 24)}d`;
      return h ? `on server ${h}h ${m}m` : `on server ${m || 1}m`;
    }

    /* The server keeps the list, so a reload, a closed laptop or a long
       playlist all survive: entries come back, downloads in flight resume
       being polled, and an entry whose file has been swept offers to start
       again. */
    async function restoreEntries() {
      let data;
      try {
        const res = await fetch('/api/entries');
        if (!res.ok) return;
        data = await res.json();
      } catch (e) {
        return;
      }
      for (const e of data.entries) {
        const c = {
          url: e.url,
          title: e.title || '',
          thumbnail: e.thumbnail || '',
          formats: [],
          selectedFormatId: e.format_id || null,
          jobId: e.job_id,
          filename: e.filename,
          error: e.error,
          status: e.status === 'done' && !e.has_file ? 'gone' : e.status,
          deleteAt: e.expires_in ? Date.now() + e.expires_in * 1000 : null,
          zone: 'history',
        };
        const idx = cardData.push(c) - 1;
        renderCard(idx);
        if (c.status === 'downloading') pollCard(idx);
      }
    }

    restoreEntries();

    setInterval(() => {
      cardData.forEach((c, idx) => {
        const el = document.getElementById(`ttl-${idx}`);
        if (el) el.textContent = ttlLabel(c);
      });
    }, 30000);

    /* Playback: the server file only. A card that has not been downloaded yet
       starts the download and plays when it lands. */
    function playCard(idx) {
      const c = cardData[idx];
      if (c.status === 'done') {
        openPlayer(idx);
      } else if (c.status !== 'downloading') {
        c.playWhenDone = true;
        dlCard(idx);
      }
    }

    function openPlayer(idx) {
      const c = cardData[idx];
      const tag = (c.filename || '').toLowerCase().endsWith('.mp3') ? 'audio' : 'video';

      const overlay = document.createElement('div');
      overlay.className = 'player-overlay';
      overlay.innerHTML = `
        <div class="player-box">
          <div class="player-head">
            <span class="player-title">${esc(c.title || c.filename || '')}</span>
            <button class="player-close" aria-label="Close" title="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <${tag} class="player-media" src="/api/stream/${c.jobId}" controls autoplay playsinline></${tag}>
        </div>
      `;

      function close() {
        const media = overlay.querySelector('.player-media');
        // Clearing the source stops the transfer; removing the node alone
        // leaves the browser fetching in some engines.
        media.pause();
        media.removeAttribute('src');
        media.load();
        overlay.remove();
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) {
        if (e.key === 'Escape') close();
      }

      overlay.addEventListener('click', e => {
        if (e.target === overlay) close();
      });
      overlay.querySelector('.player-close').addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
    }

    /* Theme: system, light, dark. "system" stores nothing and lets the
       stylesheet's media query decide. */
    const THEMES = ['system', 'light', 'dark'];
    const THEME_ICONS = {
      system: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>`,
      light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
      dark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,
    };

    function currentTheme() {
      try {
        return localStorage.getItem('theme') || 'system';
      } catch (e) {
        return 'system';
      }
    }

    function applyTheme(theme) {
      if (theme === 'system') {
        delete document.documentElement.dataset.theme;
      } else {
        document.documentElement.dataset.theme = theme;
      }
      const btn = document.getElementById('theme-btn');
      btn.innerHTML = THEME_ICONS[theme];
      btn.title = `Theme: ${theme}`;
      btn.setAttribute('aria-label', `Theme: ${theme}. Click to change.`);
    }

    function cycleTheme() {
      const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
      try {
        if (next === 'system') {
          localStorage.removeItem('theme');
        } else {
          localStorage.setItem('theme', next);
        }
      } catch (e) {}
      applyTheme(next);
    }

    applyTheme(currentTheme());
  </script>
</body>
</html>
